spring:
  application:
    name: backend

  flyway:
    enabled: false

  datasource:
    user:
      url: jdbc:postgresql://localhost:5433/user_db
      username: apple
      password: ${DB_PASSWORD:local_password}
      driver-class-name: org.postgresql.Driver

    audit:
      url: jdbc:postgresql://localhost:5433/audit_db
      username: apple
      password: ${DB_PASSWORD:local_password}
      driver-class-name: org.postgresql.Driver

    partition:
      url: jdbc:postgresql://localhost:5433/partition_db
      username: apple
      password: ${DB_PASSWORD:local_password}
      driver-class-name: org.postgresql.Driver

  thymeleaf:
    cache: false

  devtools:
    livereload:
      enabled: true

server:
  port: 8080

token:
  cookie:
    same-site: Lax
    secure: false
    access-token-max-age: 600000
    refresh-token-max-age: 600000

  email-verification-token:
    expiration: 20000

  access-token:
    secret-key: f815d5cf324e3055ad294ad6d576881c5c81239b0728a8581c6efc844a0eb00e
    expiration: 600000

  refresh-token:
    secret-key: 810514724496f65533c9821b5b7e9315fc04d6cc80bf67ee61181e63dc2abda1
    expiration: 600000
    cleanup:
      retention-period: 180d

audit:
  logs:
    partition:
      table:
        parent-table-name: audit_logs
        schema-name: public
        default-table-name-suffix: _default
        partition-id-column-name: id
        partition-local-date-time-column-name: occurred_at

      operation:
        partition-operation-type: audit_log
        partition-strategy: range

      command:
        partition-recovery-command-text: audit-log-recover

      maintenance:
        maintenance-target-months-ago: 3
        cron: "0 0 3 * * *"

partition:
  partition-table-table-name: partition_tables
  partition-range-table-name: partition_ranges
  partition-operation-table-name: partition_operations
  partition-staging-table-name: partition_stagings
  public-partition-operation-id-column-name: public_partition_operation_id
  
