spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/my_auth
    username: apple
    password: 
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # 開発中は update or create
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    cache: false

  devtools:
    livereload:
      enabled: true

server:
  port: 8080

jwt:
  access-token-secret: 8f3d9c2b7a6e1f4d9a8c5b2e7f1a3d6c9b8e5f2a1d7c4b9
  refresh-token-secret: c5e9a1f7b2d8e4c6f3a9b1d7e5c2f8a4b6d1e9f3c7a5b2d
  access-token-expiration: 10000
  refresh-token-expiration: 600000

cookie:
  same-site: Lax
  secure: false
  access-token-max-age: 10000
  refresh-token-max-age: 600000

refresh-token:
  cleanup:
    retention-period: 180d

audit:
  logs:
    partition:
      prefix: audit_logs


