spring:
  application:
    name: backend-test

  datasource:
    user:
      url: jdbc:postgresql://localhost:5433/user_db_test
      username: apple
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

    audit:
      url: jdbc:postgresql://localhost:5433/audit_db_test
      username: apple
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

    partition:
      url: jdbc:postgresql://localhost:5433/partition_db_test
      username: apple
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    database-platform: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    cache: false

logging:
  level:
    org.springframework.boot.autoconfigure: DEBUG

jwt:
  access-token-secret: test-access-secret-test-access-secret-test
  refresh-token-secret: test-refresh-secret-test-refresh-secret
  access-token-expiration: 10000
  refresh-token-expiration: 600000

cookie:
  same-site: Lax
  secure: false
  access-token-max-age: 10000
  refresh-token-max-age: 600000

test:
  user:
    email-prefix: test-user
    email-domain: example.com
    password-prefix: Password
    name-prefix: TestUser

  partition:
    recovery-failure:
      occurred-at-before: "2000-01-01T00:00:00"
      recovery-failure-inducing-table-name: recovery_failure_table
      delete-default-failure-trigger-name: test_delete_default_failure_trigger
      delete-default-failure-function-name: test_delete_default_failure_function
      delete-staging-failure-trigger-name: test_delete_staging_failure_trigger
      delete-staging-failure-function-name: test_delete_staging_failure_function