
services:
  db:
    image: postgres:17
    container_name: backend-postgres
    environment:
      POSTGRES_USER: apple
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: user_db
      TZ: Asia/Tokyo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apple"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_USER_URL: jdbc:postgresql://db:5432/user_db
      SPRING_DATASOURCE_AUDIT_URL: jdbc:postgresql://db:5432/audit_db
      SPRING_DATASOURCE_PARTITION_URL: jdbc:postgresql://db:5432/partition_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
